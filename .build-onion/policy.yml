apiVersion: build-onion/policy/v1

# Only signed v* tags release, and only if signed by one of these keys and
# pointing at the commit being built. Branch builds are checked, not sealed.
release:
  refs: [refs/tags/v*]
  tagSigners:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJkCMZITdqwz1HgiMqqI8TkJmT0MAnE723Nl24woUkCl build-onion release key

# The gate refuses to build unless these protections are in place. They are
# read with the workflow's read-only token.
repository:
  requirePullRequest: true
  blockForcePush: true
  requireCodeOwners: true
  tagsFromDefaultBranch: true
