# build-onion reusable workflow: a protected build line with SLSA Build Level 3
# provenance on GitHub-hosted runners.
#
# Call it from any repo that has a build-onion.yml:
#
#   jobs:
#     build:
#       permissions: { contents: read, id-token: write, attestations: write, packages: write }
#       uses: PatterCJ/build-onion/.github/workflows/onion-build.yml@<commit sha>
#       secrets: inherit   # only if policy plugins declare secrets
#
# Layers, inside out:
#   resolve   pin the exact build-onion commit this workflow runs at (from OIDC)
#   validate  snapshot every source file (sha256); manifest + pin checks
#   gate      release policy, build-sensitive changes, gate plugins
#   fetch     dependencies into the builder's cache; source re-verified
#   build     the caller's build, --network none, NO signing credentials;
#             source verified before and after, undeclared writes fail
#   seal      only for releasable builds: inventory (source, pipeline, gate),
#             SBOM, and signed provenance
#
# Why this is L3: the only job that can mint an OIDC token for signing (seal)
# never executes caller-controlled code, and the certificate identity it signs
# with is this reusable workflow, not the caller's. A malicious build step can
# produce bad bytes, but it cannot lie about where they came from.
name: onion-build

on:
  workflow_call:
    inputs:
      manifest:
        description: Path to the build manifest, relative to the repo root.
        type: string
        default: build-onion.yml
      policy:
        description: Path to a build-onion policy file in the repo (default built-in policy).
        type: string
        default: ""
      publish-image:
        description: Push the image output (if the manifest declares one) and attest it.
        type: boolean
        default: true
    outputs:
      releasable:
        description: Whether the gate allowed this build to be sealed.
        value: ${{ jobs.gate.outputs.releasable }}
      files-checksums:
        description: sha256sum-format checksums of the file outputs.
        value: ${{ jobs.seal.outputs.files-checksums }}
      image:
        description: Pushed image reference, pinned by digest (empty if none).
        value: ${{ jobs.seal.outputs.image }}

permissions: {}

# Caller inputs reach scripts only through env, never ${{ }} interpolation into
# `run:`, so a crafted input cannot execute in the signing job.
env:
  ONION: /tmp/onion-bin/onion
  ONION_OUT: /tmp/onion-out
  ONION_REC: /tmp/onion-rec
  MANIFEST: ${{ inputs.manifest }}
  POLICY: ${{ inputs.policy }}

jobs:
  resolve:
    name: resolve builder
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    outputs:
      repo: ${{ steps.who.outputs.repo }}
      sha: ${{ steps.who.outputs.sha }}
      cli-digest: ${{ steps.cli.outputs.digest }}
    steps:
      - name: Identify this reusable workflow's commit
        id: who
        # The OIDC token's job_workflow_ref/job_workflow_sha name the reusable
        # workflow itself, not the caller. The CLI used everywhere below is
        # built from exactly that commit, so the signer identity and the code agree.
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=build-onion" | jq -r .value)
          claims=$(python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; print(base64.urlsafe_b64decode(p+"="*(-len(p)%4)).decode())' "$token")
          ref=$(jq -r .job_workflow_ref <<<"$claims")
          sha=$(jq -r .job_workflow_sha <<<"$claims")
          repo=${ref%%/.github/workflows/*}
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "unexpected claims: $ref $sha"; exit 1; }
          echo "build-onion: $ref ($sha)"
          { echo "repo=$repo"; echo "sha=$sha"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.who.outputs.repo }}
          ref: ${{ steps.who.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build onion CLI
        id: cli
        run: |
          mkdir -p "$(dirname "$ONION")"
          CGO_ENABLED=0 go build -trimpath -o "$ONION" ./cmd/onion
          echo "digest=$(sha256sum "$ONION" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Pipeline layer — record the builder and its workflow
        env:
          REPO: ${{ steps.who.outputs.repo }}
          SHA: ${{ steps.who.outputs.sha }}
          REF: ${{ steps.who.outputs.ref }}
        run: |
          mkdir -p "$ONION_REC"
          "$ONION" record build-onion --repository "$REPO" --commit "$SHA" \
            --cli-digest "sha256:$(sha256sum "$ONION" | cut -d' ' -f1)" --out "$ONION_REC/build-onion.json"
          "$ONION" record workflow --role build-onion --ref "$REF" \
            --file .github/workflows/onion-build.yml --out "$ONION_REC/workflow-build-onion.json"
          "$ONION" record job --name resolve --runner "$ImageOS $ImageVersion" \
            --tool go="$(go env GOVERSION)" --out "$ONION_REC/job-resolve.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-cli
          path: /tmp/onion-bin/onion
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-record-resolve
          path: /tmp/onion-rec
          if-no-files-found: error

  validate:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      snapshot: ${{ steps.snap.outputs.digest }}
      has_image: ${{ steps.plan.outputs.has_image }}
      image_name: ${{ steps.plan.outputs.image_name }}
      dockerfile: ${{ steps.plan.outputs.dockerfile }}
      context: ${{ steps.plan.outputs.context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-cli
          path: /tmp/onion-bin
      - name: Check onion CLI
        run: |
          echo "${{ needs.resolve.outputs.cli-digest }}  $ONION" | sha256sum -c
          chmod +x "$ONION"
      - name: Source layer — the triggering commit, every file hashed
        # GitHub's provenance records github.sha as the source; building any
        # other commit would make that record false.
        id: snap
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          digest=$("$ONION" source snapshot --out /tmp/onion-snap/source.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "source snapshot: $digest"
      - name: Toolchain layer — manifest and pins
        id: plan
        run: '"$ONION" validate --manifest "$MANIFEST" --github-output "$GITHUB_OUTPUT"'
      - name: Pipeline layer — record the calling workflow
        # GITHUB_WORKFLOW_REF is owner/repo/<path>@<ref> of the caller.
        run: |
          mkdir -p "$ONION_REC"
          path=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}; path=${path%@*}
          "$ONION" record workflow --role caller --ref "$GITHUB_WORKFLOW_REF" --file "$path" \
            --out "$ONION_REC/workflow-caller.json"
          "$ONION" record job --name validate --runner "$ImageOS $ImageVersion" \
            --tool git="$(git --version)" --out "$ONION_REC/job-validate.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-snapshot
          path: /tmp/onion-snap/source.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-record-validate
          path: /tmp/onion-rec
          if-no-files-found: error

  gate:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      releasable: ${{ steps.gate.outputs.releasable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history (without blobs) so the change since the last build
          # point can be computed without handing plugins a token.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-cli
          path: /tmp/onion-bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-snapshot
          path: /tmp/onion-snap
      - name: Gate — may this commit be built and released?
        id: gate
        env:
          SNAPSHOT: ${{ needs.validate.outputs.snapshot }}
          BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          FORK: ${{ github.event.pull_request.head.repo.fork || false }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Plugins receive only the secret names they declare; onion filters.
          ONION_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "${{ needs.resolve.outputs.cli-digest }}  $ONION" | sha256sum -c
          chmod +x "$ONION"
          "$ONION" source verify --manifest "$MANIFEST" --snapshot /tmp/onion-snap/source.json --expect "$SNAPSHOT"
          "$ONION" gate --manifest "$MANIFEST" --policy "$POLICY" \
            --snapshot /tmp/onion-snap/source.json \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --platform github-actions --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --base "$BASE" --fork="$FORK" --actor "$GITHUB_ACTOR" --run-url "$RUN_URL" \
            --out /tmp/onion-gate/gate.json --results-dir /tmp/onion-gate/plugins \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: onion-gate
          path: /tmp/onion-gate
          if-no-files-found: ignore

  fetch:
    needs: [resolve, validate, gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-cli
          path: /tmp/onion-bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-snapshot
          path: /tmp/onion-snap
      - name: Dependency layer — fetch into the builder's cache
        env:
          SNAPSHOT: ${{ needs.validate.outputs.snapshot }}
        run: |
          echo "${{ needs.resolve.outputs.cli-digest }}  $ONION" | sha256sum -c
          chmod +x "$ONION"
          "$ONION" source verify --manifest "$MANIFEST" --snapshot /tmp/onion-snap/source.json --expect "$SNAPSHOT"
          "$ONION" fetch --manifest "$MANIFEST" --snapshot /tmp/onion-snap/source.json --cache "$RUNNER_TEMP/deps"
          tar -C "$RUNNER_TEMP/deps" -cf "$RUNNER_TEMP/deps.tar" .
          mkdir -p "$ONION_REC"
          "$ONION" record job --name fetch --runner "$ImageOS $ImageVersion" \
            --tool docker="$(docker version --format '{{.Server.Version}}')" --out "$ONION_REC/job-fetch.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-deps
          path: ${{ runner.temp }}/deps.tar
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-record-fetch
          path: /tmp/onion-rec
          if-no-files-found: error

  build:
    needs: [resolve, validate, fetch]
    runs-on: ubuntu-24.04
    # Deliberately no id-token: this job runs caller-controlled commands.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-cli
          path: /tmp/onion-bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-snapshot
          path: /tmp/onion-snap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-deps
          path: ${{ runner.temp }}
      - name: Build layer — hermetic build, source verified before and after
        env:
          SNAPSHOT: ${{ needs.validate.outputs.snapshot }}
        run: |
          echo "${{ needs.resolve.outputs.cli-digest }}  $ONION" | sha256sum -c
          chmod +x "$ONION"
          "$ONION" source verify --manifest "$MANIFEST" --snapshot /tmp/onion-snap/source.json --expect "$SNAPSHOT"
          mkdir -p "$RUNNER_TEMP/deps" && tar -C "$RUNNER_TEMP/deps" -xf "$RUNNER_TEMP/deps.tar"
          "$ONION" build --manifest "$MANIFEST" --snapshot /tmp/onion-snap/source.json \
            --cache "$RUNNER_TEMP/deps" --out "$ONION_OUT/files"
      - if: needs.validate.outputs.has_image == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package layer — reproducible OCI image
        if: needs.validate.outputs.has_image == 'true'
        env:
          DOCKERFILE: ${{ needs.validate.outputs.dockerfile }}
          CONTEXT: ${{ needs.validate.outputs.context }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          docker buildx build --network=none --platform linux/amd64 \
            --provenance=false --sbom=false \
            --output "type=oci,dest=$ONION_OUT/image.tar,rewrite-timestamp=true" \
            -f "$DOCKERFILE" "$CONTEXT"
      - name: Pipeline layer — record build tools
        run: |
          mkdir -p "$ONION_REC"
          "$ONION" record job --name build --runner "$ImageOS $ImageVersion" \
            --tool docker="$(docker version --format '{{.Server.Version}}')" \
            --tool buildx="$(docker buildx version 2>/dev/null | cut -d' ' -f2)" \
            --out "$ONION_REC/job-build.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-outputs
          path: ${{ env.ONION_OUT }}
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-record-build
          path: /tmp/onion-rec
          if-no-files-found: error

  seal:
    needs: [resolve, validate, gate, build]
    # Pull requests, feature branches and forks build and verify, but only a
    # build the gate marked releasable is ever signed.
    if: needs.gate.outputs.releasable == 'true'
    runs-on: ubuntu-24.04
    # The only job that can sign. It runs build-onion's code and pinned
    # actions only; caller-controlled commands never execute here.
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    outputs:
      files-checksums: ${{ steps.subjects.outputs.checksums }}
      image: ${{ steps.push.outputs.image }}
    env:
      HAS_IMAGE: ${{ needs.validate.outputs.has_image }}
      PUBLISH_IMAGE: ${{ inputs.publish-image }}
      IMAGE_NAME: ${{ needs.validate.outputs.image_name }}
      SNAPSHOT: ${{ needs.validate.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-cli
          path: /tmp/onion-bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-snapshot
          path: /tmp/onion-snap
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-gate
          path: /tmp/onion-gate
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: onion-record-*
          merge-multiple: true
          path: ${{ env.ONION_REC }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-outputs
          path: ${{ env.ONION_OUT }}
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        id: syft
      - name: Inventory layer — hash everything, trust nothing reported
        id: subjects
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          echo "${{ needs.resolve.outputs.cli-digest }}  $ONION" | sha256sum -c
          chmod +x "$ONION"
          "$ONION" record job --name seal --runner "$ImageOS $ImageVersion" \
            --tool syft="$("$SYFT" version -o json | jq -r .version)" \
            --tool skopeo="$(skopeo --version | cut -d' ' -f3)" \
            --out "$ONION_REC/job-seal.json"
          image_args=()
          [ "$HAS_IMAGE" = true ] && image_args=(--image-archive "$ONION_OUT/image.tar")
          "$ONION" inventory --manifest "$MANIFEST" \
            --snapshot /tmp/onion-snap/source.json --expect-snapshot "$SNAPSHOT" \
            --records "$ONION_REC" --gate /tmp/onion-gate/gate.json --platform github-actions \
            --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --files "$ONION_OUT/files" "${image_args[@]}" \
            --invocation "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/inventory.json"
          (cd "$ONION_OUT/files" && sha256sum -- *) > "$RUNNER_TEMP/files.sha256"
          { echo 'checksums<<EOF'; cat "$RUNNER_TEMP/files.sha256"; echo EOF; } >> "$GITHUB_OUTPUT"
          if [ "$HAS_IMAGE" = true ]; then
            echo "image_digest=$("$ONION" digest --oci "$ONION_OUT/image.tar")" >> "$GITHUB_OUTPUT"
          fi
      - name: Bottom-up SBOM of what was actually built
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          "$SYFT" scan "dir:$ONION_OUT/files" -o "cyclonedx-json=$RUNNER_TEMP/files.cdx.json"
          if [ "$HAS_IMAGE" = true ]; then
            "$SYFT" scan "oci-archive:$ONION_OUT/image.tar" -o "cyclonedx-json=$RUNNER_TEMP/image.cdx.json"
          fi

      # --- file outputs ---
      - name: Seal files — SLSA provenance
        id: files-prov
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/files.sha256
      - name: Seal files — SBOM
        id: files-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/files.sha256
          sbom-path: ${{ runner.temp }}/files.cdx.json
      - name: Seal files — inventory
        id: files-inv
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/files.sha256
          predicate-type: https://github.com/PatterCJ/build-onion/inventory/v1
          predicate-path: ${{ runner.temp }}/inventory.json

      # --- image output ---
      - name: Push image with its manifest bytes preserved
        id: push
        if: env.HAS_IMAGE == 'true' && env.PUBLISH_IMAGE == 'true'
        env:
          DIGEST: ${{ steps.subjects.outputs.image_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --preserve-digests "oci-archive:$ONION_OUT/image.tar" "docker://$IMAGE_NAME:sha-$GITHUB_SHA"
          pushed=$(skopeo inspect --raw "docker://$IMAGE_NAME@$DIGEST" | sha256sum | cut -d' ' -f1)
          test "sha256:$pushed" = "$DIGEST"
          echo "image=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Seal image — SLSA provenance
        id: image-prov
        if: steps.push.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.subjects.outputs.image_digest }}
          push-to-registry: true
      - name: Seal image — SBOM
        id: image-sbom
        if: steps.push.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.subjects.outputs.image_digest }}
          sbom-path: ${{ runner.temp }}/image.cdx.json
          push-to-registry: true
      - name: Seal image — inventory
        id: image-inv
        if: steps.push.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.subjects.outputs.image_digest }}
          predicate-type: https://github.com/PatterCJ/build-onion/inventory/v1
          predicate-path: ${{ runner.temp }}/inventory.json
          push-to-registry: true

      - name: Collect bundles for offline peeling
        env:
          IMAGE_REF: ${{ steps.push.outputs.image }}
          BUNDLES: >-
            ${{ steps.files-prov.outputs.bundle-path }}
            ${{ steps.files-sbom.outputs.bundle-path }}
            ${{ steps.files-inv.outputs.bundle-path }}
            ${{ steps.image-prov.outputs.bundle-path }}
            ${{ steps.image-sbom.outputs.bundle-path }}
            ${{ steps.image-inv.outputs.bundle-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/bundles"
          i=0
          for b in $BUNDLES; do i=$((i+1)); cp "$b" "$RUNNER_TEMP/bundles/$i.jsonl"; done
          {
            echo "### 🧅 build-onion sealed $(wc -l < "$RUNNER_TEMP/files.sha256") file(s)"
            echo "Source snapshot: \`$SNAPSHOT\`"
            echo '```'; cat "$RUNNER_TEMP/files.sha256"; echo '```'
            if [ -n "$IMAGE_REF" ]; then echo "Image: \`$IMAGE_REF\`"; fi
            echo
            echo "Peel it back: \`onion peel <artifact> --repo $GITHUB_REPOSITORY --commit $GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-bundles
          path: ${{ runner.temp }}/bundles
          if-no-files-found: error
