name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Validate own manifest and pins
        run: go run ./cmd/onion validate

  # The real build line on every pull request: staged inputs, restricted
  # fetch, hermetic build and image. An input missing from build.inputs fails
  # here instead of at release. Pull request builds are never sealed. Fork
  # pull requests get no OIDC token, so they skip it.
  build-line:
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/onion-build.yml
    with:
      policy: .build-onion/policy.yml
