# build-onion builds, verifies and publishes itself through its own three
# lines, with a scan recorded along the way, then checks the published image.
# Releases come only from signed v* tags; pull requests are checked by ci.yml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

# Every step runs with -e -o pipefail: a failing command in a pipe (such as
# `onion peel | tee`) fails the step.
defaults:
  run:
    shell: bash

jobs:
  # The tag must match the version compiled into onion, so `onion version`
  # always names the release it came from.
  version:
    name: version matches tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          got=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/onion/main.go)
          if [ "v$got" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Version mismatch::cmd/onion/main.go says $got, but the tag is $GITHUB_REF_NAME. Bump the version in a pull request and tag again with a new version."
            exit 1
          fi

  build:
    needs: version
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/onion-build.yml
    with:
      policy: .build-onion/policy.yml

  # An ordinary pipeline scan. build-onion doesn't run or judge it; the job
  # records that it ran, when, and against which source snapshot.
  vulncheck:
    name: scan (govulncheck)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ONION: /tmp/onion-bin/onion
      SNAPSHOT: ${{ needs.build.outputs.snapshot }}
      GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-cli
          path: /tmp/onion-bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-snapshot
          path: /tmp/onion-snap
      - name: Scan the snapshotted source and record it
        env:
          CLI_DIGEST: ${{ needs.build.outputs.cli-digest }}
        run: |
          echo "$CLI_DIGEST  $ONION" | sha256sum -c
          chmod +x "$ONION"
          "$ONION" source verify --snapshot /tmp/onion-snap/source.json --expect "$SNAPSHOT"
          mkdir -p /tmp/onion-rec /tmp/scan-report
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # With -format json, govulncheck exits 0 whatever it finds; a
          # non-zero exit means the analysis itself didn't complete.
          rc=0
          go run "$GOVULNCHECK" -format json ./... > /tmp/scan-report/govulncheck.json || rc=$?
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          status=(--status completed)
          [ "$rc" -eq 0 ] || status=(--status failed --coverage "govulncheck exited $rc")
          "$ONION" record scan --name vulncheck --tool govulncheck --version "${GOVULNCHECK##*@}" \
            --stage pre-build --started "$started" --finished "$finished" "${status[@]}" \
            --subject-kind source --subject "$SNAPSHOT" \
            --report /tmp/scan-report/govulncheck.json \
            --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out /tmp/onion-rec/scan-vulncheck.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-record-scan-vulncheck
          path: /tmp/onion-rec
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-report-vulncheck
          path: /tmp/scan-report
          if-no-files-found: error

  verify:
    needs: [build, vulncheck]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/onion-verify.yml
    with:
      snapshot: ${{ needs.build.outputs.snapshot }}
      releasable: ${{ needs.build.outputs.releasable }}
      policy: .build-onion/policy.yml

  # The release before this one: the publish line compares with it.
  previous:
    name: previous release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.find.outputs.image }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName --jq '.[].tagName' \
            | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          echo "previous release: ${tag:-none}"
          if [ -n "$tag" ]; then echo "image=ghcr.io/pattercj/build-onion:$tag" >> "$GITHUB_OUTPUT"; fi

  publish:
    needs: [build, verify, previous]
    if: needs.build.outputs.releasable == 'true'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/onion-publish.yml
    with:
      image-digest: ${{ needs.verify.outputs.image-digest }}
      baseline: ${{ needs.previous.outputs.image }}

  # The new release is never the only judge of itself: an independent
  # verifier and the previous release check it too.
  peel:
    name: peel (dogfood)
    needs: [publish, previous]
    if: needs.publish.outputs.image != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      PREVIOUS: ${{ needs.previous.outputs.image }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Log in to the registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Independent verifier (gh attestation verify)
        run: |
          gh attestation verify "oci://$IMAGE" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/onion-verify.yml" \
            --source-digest "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: native
        continue-on-error: true
        with:
          name: onion-native-bundles
          path: /tmp/native-bundles
      - name: Peeled using only onion attest's bundles (comparison)
        if: steps.native.outcome == 'success'
        continue-on-error: true
        run: |
          docker run --rm -e GITHUB_TOKEN -v "$HOME/.docker:/home/nonroot/.docker:ro" -v /tmp/native-bundles:/bundles:ro "$IMAGE" \
            peel "$IMAGE" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --bundles /bundles | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Peeled using only the registry's bundles (comparison)
        continue-on-error: true
        run: |
          docker run --rm -v "$HOME/.docker:/home/nonroot/.docker:ro" "$IMAGE" \
            peel "$IMAGE" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --attestations registry | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Peeled by the previous release
        run: |
          if [ -z "$PREVIOUS" ]; then
            echo "::notice::no earlier release to peel with"
            exit 0
          fi
          echo "peeling with $PREVIOUS"
          docker run --rm -e GITHUB_TOKEN -v "$HOME/.docker:/home/nonroot/.docker:ro" "$PREVIOUS" \
            peel "$IMAGE" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Peeled by itself, compared with the previous release
        run: |
          baseline=()
          [ -n "$PREVIOUS" ] && baseline=(--baseline "$PREVIOUS")
          docker run --rm -e GITHUB_TOKEN -v "$HOME/.docker:/home/nonroot/.docker:ro" "$IMAGE" \
            peel "$IMAGE" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" "${baseline[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
