# build-onion publish line. It publishes only what `onion peel` verifies as
# sealed by the security line, and it cannot sign anything itself. The publish
# job runs in a GitHub environment, so required reviewers, wait timers and
# branch rules configured there apply before anything is released.
#
#   jobs:
#     publish:
#       needs: [verify]
#       permissions: { contents: write, packages: write, id-token: write }
#       uses: PatterCJ/build-onion/.github/workflows/onion-publish.yml@<commit sha>
#       with:
#         image-digest: ${{ needs.verify.outputs.image-digest }}
#         baseline: ghcr.io/acme/widget:v1.4.0      # optional: the last release
#
# Jobs:
#   resolve   pin this workflow's own build-onion commit (from OIDC; read for
#             its claims only) and build the CLI used to peel
#   publish   peel every sealed output; push the image by digest; attach files
#             and bundles to the GitHub release for tags
name: onion-publish

on:
  workflow_call:
    inputs:
      manifest:
        description: Path to the build manifest, relative to the repo root.
        type: string
        default: build-onion.yml
      environment:
        description: GitHub environment the publish job runs in. Configure approvals there.
        type: string
        default: release
      image-digest:
        description: Sealed image digest from onion-verify.yml (empty if none).
        type: string
        default: ""
      baseline:
        description: >-
          A previously published image to compare the new one with, usually the
          last release (e.g. ghcr.io/acme/widget:v1.4.0). Dependencies that lost
          provenance or changed signer since then block publishing. Skipped with
          a warning if the image doesn't exist.
        type: string
        default: ""
      accept-signer-changes:
        description: Report dependency provenance and signer changes against the baseline as notes instead of blocking.
        type: boolean
        default: false
    outputs:
      image:
        description: Published image reference, pinned by digest (empty if none).
        value: ${{ jobs.publish.outputs.image }}

permissions: {}

env:
  ONION: /tmp/onion-publish-bin/onion
  VERIFIED: /tmp/onion-verified
  BUNDLES: /tmp/onion-bundles
  MANIFEST: ${{ inputs.manifest }}
  IMAGE_DIGEST: ${{ inputs.image-digest }}
  BASELINE: ${{ inputs.baseline }}
  ACCEPT_SIGNER_CHANGES: ${{ inputs.accept-signer-changes }}

jobs:
  resolve:
    name: resolve publisher
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    outputs:
      repo: ${{ steps.who.outputs.repo }}
      cli-digest: ${{ steps.cli.outputs.digest }}
    steps:
      - name: Identify this reusable workflow's commit
        id: who
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=build-onion" | jq -r .value)
          claims=$(python3 -c 'import sys,json,base64; p=sys.argv[1].split(".")[1]; print(base64.urlsafe_b64decode(p+"="*(-len(p)%4)).decode())' "$token")
          ref=$(jq -r .job_workflow_ref <<<"$claims")
          sha=$(jq -r .job_workflow_sha <<<"$claims")
          repo=${ref%%/.github/workflows/*}
          [[ "$sha" =~ ^[0-9a-f]{40}$ && "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "unexpected claims: $ref $sha"; exit 1; }
          echo "build-onion (publish line): $ref ($sha)"
          { echo "repo=$repo"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.who.outputs.repo }}
          ref: ${{ steps.who.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build onion CLI
        id: cli
        run: |
          mkdir -p "$(dirname "$ONION")"
          CGO_ENABLED=0 go build -trimpath -o "$ONION" ./cmd/onion
          echo "digest=$(sha256sum "$ONION" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onion-publish-cli
          path: /tmp/onion-publish-bin/onion
          if-no-files-found: error

  publish:
    needs: resolve
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    # Publish rights only. No id-token: this line cannot mint signatures, so it
    # cannot vouch for anything the security line didn't seal.
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      SIGNER: ${{ needs.resolve.outputs.repo }}/.github/workflows/onion-verify.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-publish-cli
          path: /tmp/onion-publish-bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-verified
          path: ${{ env.VERIFIED }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: onion-bundles
          path: ${{ env.BUNDLES }}
      - name: Peel every output before it leaves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ needs.resolve.outputs.cli-digest }}  $ONION" | sha256sum -c
          chmod +x "$ONION"
          # The baseline's bundles come from the attestations API.
          baseline=()
          if [ -n "$BASELINE" ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            if skopeo inspect --raw "docker://$BASELINE" > /dev/null; then
              baseline=(--baseline "$BASELINE")
              [ "$ACCEPT_SIGNER_CHANGES" = true ] && baseline+=(--accept-signer-changes)
            else
              echo "::warning::baseline $BASELINE not found; publishing without comparing to it"
            fi
          fi
          peel() { "$ONION" peel "$@" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --signer "$SIGNER" --bundles "$BUNDLES" --source . | tee -a "$GITHUB_STEP_SUMMARY"; }
          shopt -s nullglob  # an image-only manifest has no files
          for f in "$VERIFIED"/out/files/*; do peel "$f"; done
          if [ -f "$VERIFIED/out/image.tar" ]; then
            test "$("$ONION" digest --oci "$VERIFIED/out/image.tar")" = "$IMAGE_DIGEST"
            GITHUB_TOKEN=$GH_TOKEN peel "$VERIFIED/out/image.tar" --oci "${baseline[@]}"
          fi
      - name: Push the verified image by digest
        id: push
        if: inputs.image-digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$("$ONION" validate --manifest "$MANIFEST" --github-output /dev/stdout | sed -n 's/^image_name=//p')
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo copy --preserve-digests "oci-archive:$VERIFIED/out/image.tar" "docker://$name:sha-$GITHUB_SHA"
          pushed=$(skopeo inspect --raw "docker://$name@$IMAGE_DIGEST" | sha256sum | cut -d' ' -f1)
          test "sha256:$pushed" = "$IMAGE_DIGEST"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            skopeo copy --preserve-digests "docker://$name@$IMAGE_DIGEST" "docker://$name:$GITHUB_REF_NAME"
          fi
          echo "image=$name@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published \`$name@$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Attach files and bundles to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --notes "Sealed by build-onion. Verify with: onion peel <file> --repo $GITHUB_REPOSITORY --commit $GITHUB_SHA"
          (cd "$BUNDLES" && tar -czf "$RUNNER_TEMP/bundles.tar.gz" .)
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" "$VERIFIED"/out/files/* "$RUNNER_TEMP/bundles.tar.gz" --clobber
